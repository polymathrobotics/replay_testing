---

stages:
  - build
  - test

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

include:
  - component: gitlab.com/polymathrobotics/polymath_core/pre-commit@ci-1.0
  - component: gitlab.com/polymathrobotics/polymath_core/ros2-package@ci-1.0
    # inputs:
    #   base_image: docker.io/polymathrobotics/ros:humble-builder-ubuntu

build_and_test:
  extends: .ros2_build_and_test
  variables:
    WORKSPACE: $CI_PROJECT_DIR
    ARTIFACTS_DEST: .ci/artifacts
    PACKAGES: ""
    USE_NEXUS: true
